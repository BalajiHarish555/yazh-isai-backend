# Render blueprint: web service + managed Postgres.
# Usage: push this repo to GitHub, then "New > Blueprint" in Render.
# Set a real JWT_SECRET in the dashboard after first deploy.
databases:
  - name: yazh-db
    plan: free

services:
  - type: web
    name: yazh-isai
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yazh-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Custom-domain frontend origin, if the SPA is served elsewhere.
      # Same-origin deploys need nothing: RENDER_EXTERNAL_URL is allowlisted
      # automatically (see src/main.ts). The native Android/iOS apps run
      # from a local origin, so it is allowlisted explicitly here.
      - key: CORS_ORIGIN
        value: "https://localhost,http://localhost,capacitor://localhost"

  # Free web services sleep after ~15 min idle, and the first visit then
  # pays a 30-60s cold start. This cron pings /health every 10 minutes to
  # keep the instance (and its caches) warm. It does NOT fix YouTube
  # throttling — only a paid instance with full CPU does that.
  # NOTE: the URL below must match this service's public address.
  - type: cron
    name: yazh-keep-warm
    plan: free
    schedule: "*/10 * * * *"
    command: "curl -fsS https://yazh-isai.onrender.com/api/v1/health > /dev/null"
