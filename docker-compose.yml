version: '3.8'

services:
  # NestJS Production Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=production_super_secret_jwt_key_at_least_32_characters_long
      - CORS_ORIGIN=http://localhost:5173,http://localhost:80
    restart: always
